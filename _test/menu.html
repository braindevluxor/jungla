<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Menú lateral · La Jungla</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    body { background: #f4f7f5; margin: 0; }
    .app { display: flex; min-height: 100vh; }
    .sidebar { display: block !important; padding: 14px 12px; }
    .tarjeta { padding: 18px; }
  </style>
</head>
<body>
  <div class="app">
    <nav class="sidebar" aria-label="Secciones">
      <p class="sidebar__group-title">Caballeriza</p>
      <div id="menu"></div>
    </nav>
    <main class="main">
      <div class="tarjeta card">
        <div class="card__head" id="cabecera"></div>
        <div class="card__body" id="cuerpo"></div>
      </div>
    </main>
  </div>
  <script type="module">
    import { icono } from '../js/lib/icons.js';
    import { menuDe } from '../js/lib/permisos.js';

    // Esta página vive en /_test/ → se corrige la ruta relativa a la raíz
    const raro = (s) => s.replaceAll('icons/flaticon/', '../icons/flaticon/');

    // Igual que la app real: menú del dueño + cabecera de tarjeta
    document.getElementById('menu').innerHTML = menuDe('dueno').map((m, i) => `
      <button type="button" class="navitem" ${i === 1 ? 'aria-current="page"' : ''}>
        ${raro(icono(m.icono, 19))}<span>${m.etiqueta}</span>
      </button>`).join('');

    document.getElementById('cabecera').innerHTML =
      `${raro(icono('caballos', 17))}<h2 class="card__title">Caballos</h2>
       <span class="chip chip--oro">${raro(icono('herrajes', 13))} Herrajes</span>`;

    document.getElementById('cuerpo').innerHTML =
      `<div class="empty">
        <div class="empty__ico">${raro(icono('caballos', 44))}</div>
        <p class="empty__title">Sin caballos</p>
      </div>`;

    const d = document.createElement('div');
    d.id = 'resultado-prueba';
    d.style.display = 'none';
    const srcs = [...document.querySelectorAll('.ico--raster')]
      .map((e) => (getComputedStyle(e).maskImage.match(/url\("?([^")]+)"?\)/) || [])[1])
      .filter(Boolean);
    const ok = await Promise.all(srcs.map(async (u) => {
      try { return (await fetch(u)).ok; } catch { return false; }
    }));
    d.textContent = JSON.stringify({
      rasterEnMenu: document.querySelectorAll('.sidebar .ico--raster').length,
      rasterTotal: document.querySelectorAll('.ico--raster').length,
      svgTotal: document.querySelectorAll('svg.ico').length,
      imagenesOk: ok.filter(Boolean).length,
      imagenesTotal: srcs.length,
    });
    document.body.appendChild(d);
  </script>
</body>
</html>
